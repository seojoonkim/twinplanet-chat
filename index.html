<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dcff00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
    <meta name="description" content="新しい学校のリーダーズ、矢吹奈子、鈴木奈々 など TWIN PLANET タレントと AI チャット" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="twinplanet.chat" />
    <meta property="og:title" content="twinplanet.chat | TWIN PLANET AI チャット" />
    <meta property="og:description" content="新しい学校のリーダーズ、矢吹奈子、鈴木奈々 など TWIN PLANET タレントと AI チャット" />
    <meta property="og:url" content="https://twinplanet.chat" />
    <meta property="og:image" content="https://twinplanet.chat/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="twinplanet.chat | TWIN PLANET AI チャット" />
    <meta name="twitter:description" content="新しい学校のリーダーズ、矢吹奈子など TWIN PLANET タレントと AI チャット！" />
    <meta name="twitter:image" content="https://twinplanet.chat/og-image.png" />
    <title>twinplanet.chat | TWIN PLANET AI チャット</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;height:100vh;background:linear-gradient(135deg,#f0ff80,#dcff00)">
        <div style="position:relative;width:88px;height:88px">
          <img src="/logo.png" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;" alt="logo">
          <span style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:24px;animation:ep-c 2.4s ease-in-out infinite;animation-delay:0s">⭐</span>
          <span style="position:absolute;top:10%;right:-8px;font-size:22px;animation:ep 2.4s ease-in-out infinite;animation-delay:0.4s">🌟</span>
          <span style="position:absolute;bottom:10%;right:-8px;font-size:22px;animation:ep 2.4s ease-in-out infinite;animation-delay:0.8s">✨</span>
          <span style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:22px;animation:ep-c 2.4s ease-in-out infinite;animation-delay:1.2s">💫</span>
          <span style="position:absolute;bottom:10%;left:-8px;font-size:22px;animation:ep 2.4s ease-in-out infinite;animation-delay:1.6s">🎵</span>
          <span style="position:absolute;top:10%;left:-8px;font-size:22px;animation:ep 2.4s ease-in-out infinite;animation-delay:2.0s">🌸</span>
        </div>
        <p style="font-size:1rem;font-weight:700;letter-spacing:-0.01em;background:linear-gradient(90deg,#1a1a1a,#333,#1a1a1a);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:sh 3s linear infinite;font-family:sans-serif">twinplanet.chat</p>
      </div>
      <style>
        @keyframes ep{0%{transform:translate(0,0) scale(0.5);opacity:0}25%{transform:translate(0,-6px) scale(1.2);opacity:1}70%{transform:translate(0,-10px) scale(1);opacity:0.85}100%{transform:translate(0,-4px) scale(0.7);opacity:0}}
        @keyframes ep-c{0%{transform:translateX(-50%) translateY(0) scale(0.5);opacity:0}25%{transform:translateX(-50%) translateY(-6px) scale(1.2);opacity:1}70%{transform:translateX(-50%) translateY(-10px) scale(1);opacity:0.85}100%{transform:translateX(-50%) translateY(-4px) scale(0.7);opacity:0}}
        @keyframes sh{0%{background-position:0% center}100%{background-position:200% center}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
